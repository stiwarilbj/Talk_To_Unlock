name: Quick CI check

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quick-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quick-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.13.0
      - name: Run the quick syntax and unit check
        shell: bash
        run: |
          set -euo pipefail
          node -e "JSON.parse(require('node:fs').readFileSync('manifest.json', 'utf8'));"
          for file in background.js content.js dashboard.js popup.js preview-api.js shared.js; do
            node --check "$file"
          done
          node --test tests/*.test.js
